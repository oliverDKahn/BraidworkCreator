<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braidwork Creator</title>
  <style>
    :root {
      --dot-fill: #d7e8f7;
      --dot-stroke: #1f3552;
      --ink: #222;
      --muted: #555;
      --accent: #2f6f9e;
      --select: #e08a2c;
      --invalid: #d64545;
      --line: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: var(--ink);
      min-height: 100vh;
    }

    /* ---- Setup screen ---- */
    #setup-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }
    #setup-screen h1 {
      font-size: 2rem;
      margin-bottom: 0.4rem;
    }
    #setup-screen p {
      color: var(--muted);
      margin-bottom: 1.75rem;
    }
    .column-options {
      display: grid;
      grid-template-columns: repeat(4, 3.25rem);
      gap: 0.6rem;
      justify-content: center;
    }
    .column-options button {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      border: 2px solid var(--dot-stroke);
      background: var(--dot-fill);
      color: var(--dot-stroke);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .column-options button:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ---- Canvas screen ---- */
    #canvas-screen {
      display: none;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }
    #canvas-screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .canvas-header h1 {
      font-size: 1.25rem;
      margin: 0;
    }
    #canvas-hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin: -0.5rem 0 1rem;
      text-align: center;
    }
    .header-btn {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .header-btn:hover,
    .header-btn.active {
      background: var(--accent);
      color: #fff;
    }
    #dot-grid-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #dot-grid {
      display: block;
      height: auto;
    }
    #dot-grid .dot {
      cursor: pointer;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
    }
    #dot-grid .dot:hover {
      stroke: var(--accent);
    }
    #dot-grid .dot.dot-selected {
      stroke: var(--select);
      stroke-width: 3;
    }
    #dot-grid .dot.dot-invalid {
      stroke: var(--invalid);
      stroke-width: 3;
    }
    #dot-grid .braid-line {
      stroke: var(--line);
      stroke-width: 5;
      stroke-linecap: round;
    }
  </style>
</head>
<body>

  <!-- Screen 1: choose number of dot columns -->
  <main id="setup-screen">
    <div>
      <h1>Braidwork Creator</h1>
      <p>How many dot columns would you like?</p>
      <div class="column-options" id="column-options"></div>
    </div>
  </main>

  <!-- Screen 2: the dot grid -->
  <section id="canvas-screen">
    <div class="canvas-header">
      <h1 id="canvas-title"></h1>
      <button id="extras-btn" class="header-btn" type="button">Toggle Extra Lines</button>
      <button id="back-btn" class="header-btn" type="button">Change columns</button>
    </div>
    <p id="canvas-hint">Click a dot, then click another dot in the same row or column to connect them. Click a connected pair again to remove that line. Toggle Extra Lines fills in the side borders and the diagonal pairs.</p>
    <div id="dot-grid-wrap"></div>
  </section>

  <script>
    // Only odd column counts: the two outer columns then share the same
    // vertical offset, so the pattern stays symmetric side to side.
    const COLUMN_OPTIONS = [3, 5, 7, 9];
    const DOTS_PER_COLUMN = 15;
    // Dots are addressed by column and by "half-row" h, so that the
    // half-row offset of odd columns falls on whole numbers:
    // column c holds dots at h = 2*row + (c % 2).
    const MAX_H = 2 * (DOTS_PER_COLUMN - 1);

    const setupScreen = document.getElementById('setup-screen');
    const canvasScreen = document.getElementById('canvas-screen');
    const columnOptions = document.getElementById('column-options');
    const dotGridWrap = document.getElementById('dot-grid-wrap');
    const canvasTitle = document.getElementById('canvas-title');
    const backBtn = document.getElementById('back-btn');
    const extrasBtn = document.getElementById('extras-btn');

    let currentGrid = null;

    for (const n of COLUMN_OPTIONS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = n;
      btn.addEventListener('click', () => showDotGrid(n));
      columnOptions.appendChild(btn);
    }

    backBtn.addEventListener('click', () => {
      canvasScreen.classList.remove('active');
      setupScreen.style.display = 'flex';
      dotGridWrap.innerHTML = '';
      currentGrid = null;
    });

    extrasBtn.addEventListener('click', () => {
      if (!currentGrid) return;
      extrasBtn.classList.toggle('active', currentGrid.toggleExtras());
    });

    function showDotGrid(numColumns) {
      setupScreen.style.display = 'none';
      canvasScreen.classList.add('active');
      canvasTitle.textContent = `${numColumns} column${numColumns === 1 ? '' : 's'}`;
      dotGridWrap.innerHTML = '';
      extrasBtn.classList.remove('active');
      currentGrid = buildDotGrid(numColumns);
      dotGridWrap.appendChild(currentGrid.svg);
    }

    const SVG_NS = 'http://www.w3.org/2000/svg';

    // Builds an SVG of evenly spaced, clickable dot columns. Every other
    // column is offset vertically by half the row spacing, matching the
    // staggered grid used as the starting point for Islamic geometric
    // braid patterns. Clicking two dots that share a row or column draws
    // a straight line snapped between their centers; diagonal pairs are
    // rejected. Clicking an already-connected pair removes that line.
    //
    // "Extra lines" adds the generated layer: vertical borders down the
    // two outer columns, plus a pair of diagonals inside every open
    // diamond group of four dots (see fillsDiamonds below).
    function buildDotGrid(numColumns) {
      const colSpacing = 92;
      const rowSpacing = 64;
      const radius = 9;
      const marginX = 46;
      const marginY = 46;
      const halfRow = rowSpacing / 2;

      const width = marginX * 2 + colSpacing * (numColumns - 1);
      const height = marginY * 2 + rowSpacing * (DOTS_PER_COLUMN - 1) + halfRow;

      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('id', 'dot-grid');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.style.maxWidth = '100%';

      const extrasLayer = document.createElementNS(SVG_NS, 'g');
      const linesLayer = document.createElementNS(SVG_NS, 'g');
      const dotsLayer = document.createElementNS(SVG_NS, 'g');
      svg.appendChild(extrasLayer);
      svg.appendChild(linesLayer);
      svg.appendChild(dotsLayer);

      const dots = new Map();  // "c,h" -> dot
      const manual = new Map(); // "c,h|c,h" -> { a, b, el }
      let selected = null;
      let extrasOn = false;

      for (let col = 0; col < numColumns; col++) {
        for (let row = 0; row < DOTS_PER_COLUMN; row++) {
          const h = row * 2 + (col % 2);
          const x = marginX + col * colSpacing;
          const y = marginY + h * halfRow;

          const circle = document.createElementNS(SVG_NS, 'circle');
          circle.setAttribute('class', 'dot');
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', y);
          circle.setAttribute('r', radius);
          circle.setAttribute('fill', 'var(--dot-fill)');
          circle.setAttribute('stroke', 'var(--dot-stroke)');
          circle.setAttribute('stroke-width', '1.5');

          const dot = { c: col, h, x, y, el: circle, key: `${col},${h}` };
          circle.addEventListener('click', () => handleDotClick(dot));
          dotsLayer.appendChild(circle);
          dots.set(dot.key, dot);
        }
      }

      // ---- clicking dots draws straight lines ----

      function handleDotClick(dot) {
        if (!selected) {
          selected = dot;
          dot.el.classList.add('dot-selected');
          return;
        }

        if (selected === dot) {
          deselect();
          return;
        }

        const a = selected;
        if (a.c !== dot.c && a.h !== dot.h) {
          flashInvalid(dot.el); // diagonal: not a straight line
          return;
        }

        const key = lineKey(a, dot);
        if (manual.has(key)) {
          const line = manual.get(key);
          line.el.remove();
          manual.delete(key);
        } else if (extrasOn && crossesFilledDiamond(a, dot)) {
          flashInvalid(dot.el); // a generated pair already occupies that diamond
          return;
        } else {
          addManualLine(a, dot);
        }

        deselect();
        renderExtras();
      }

      function deselect() {
        if (selected) selected.el.classList.remove('dot-selected');
        selected = null;
      }

      function flashInvalid(el) {
        el.classList.add('dot-invalid');
        setTimeout(() => el.classList.remove('dot-invalid'), 350);
      }

      function lineKey(a, b) {
        return a.key < b.key ? `${a.key}|${b.key}` : `${b.key}|${a.key}`;
      }

      function addManualLine(a, b) {
        manual.set(lineKey(a, b), { a, b, el: drawLine(a, b, linesLayer) });
      }

      function drawLine(a, b, layer) {
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('class', 'braid-line');
        line.setAttribute('x1', a.x);
        line.setAttribute('y1', a.y);
        line.setAttribute('x2', b.x);
        line.setAttribute('y2', b.y);
        layer.appendChild(line);
        return line;
      }

      // ---- diamond groups of four dots ----
      //
      // A diamond is addressed by its left dot (c, h). Its other three
      // dots are the top (c+1, h-1), the bottom (c+1, h+1) and the right
      // (c+2, h). Its horizontal axis is left-to-right, its vertical axis
      // top-to-bottom -- exactly the two straight lines a user can draw
      // through it.

      const dot = (c, h) => dots.get(`${c},${h}`);

      function isComplete(c, h) {
        return !!(dot(c, h) && dot(c + 2, h) && dot(c + 1, h - 1) && dot(c + 1, h + 1));
      }

      // A straight line blocks every diamond whose axis it covers, so a
      // long line can block several diamonds at once.
      function isBlocked(c, h) {
        for (const { a, b } of manual.values()) {
          if (a.h === b.h && a.h === h) {
            if (Math.min(a.c, b.c) <= c && Math.max(a.c, b.c) >= c + 2) return true;
          }
          if (a.c === b.c && a.c === c + 1) {
            if (Math.min(a.h, b.h) <= h - 1 && Math.max(a.h, b.h) >= h + 1) return true;
          }
        }
        return false;
      }

      // The diamonds whose axis a proposed straight line would cover.
      function coveredDiamonds(a, b) {
        const out = [];
        if (a.h === b.h) {
          const c1 = Math.min(a.c, b.c);
          const c2 = Math.max(a.c, b.c);
          for (let c = c1; c + 2 <= c2; c += 2) out.push([c, a.h]);
        } else {
          const h1 = Math.min(a.h, b.h);
          const h2 = Math.max(a.h, b.h);
          for (let h = h1 + 1; h + 1 <= h2; h += 2) out.push([a.c - 1, h]);
        }
        return out;
      }

      function crossesFilledDiamond(a, b) {
        return coveredDiamonds(a, b).some(([c, h]) => isComplete(c, h) && !isBlocked(c, h));
      }

      // ---- the generated layer ----

      function renderExtras() {
        extrasLayer.replaceChildren();
        if (!extrasOn) return;

        // Vertical borders down the two outer columns.
        for (const c of [0, numColumns - 1]) {
          const top = dot(c, c % 2);
          const bottom = dot(c, c % 2 + MAX_H);
          if (top && bottom) drawLine(top, bottom, extrasLayer);
        }

        // A pair of parallel diagonals in every open diamond. The
        // direction alternates band by band: diamonds whose left column is
        // even take the two down-right sides, odd ones the two up-right
        // sides, which is what gives the pattern its woven look.
        for (let c = 0; c + 2 < numColumns; c++) {
          for (let h = c % 2; h <= c % 2 + MAX_H; h += 2) {
            if (!isComplete(c, h) || isBlocked(c, h)) continue;

            const left = dot(c, h);
            const top = dot(c + 1, h - 1);
            const bottom = dot(c + 1, h + 1);
            const right = dot(c + 2, h);

            if (c % 2 === 0) {
              drawLine(left, bottom, extrasLayer);
              drawLine(top, right, extrasLayer);
            } else {
              drawLine(left, top, extrasLayer);
              drawLine(bottom, right, extrasLayer);
            }
          }
        }
      }

      return {
        svg,
        toggleExtras() {
          extrasOn = !extrasOn;
          deselect();
          renderExtras();
          return extrasOn;
        }
      };
    }
  </script>
</body>
</html>
