<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braidwork Creator</title>
  <style>
    :root {
      --dot-fill: #d7e8f7;
      --dot-stroke: #1f3552;
      --ink: #222;
      --muted: #555;
      --accent: #2f6f9e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: var(--ink);
      min-height: 100vh;
    }

    /* ---- Setup screen ---- */
    #setup-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }
    #setup-screen h1 {
      font-size: 2rem;
      margin-bottom: 0.4rem;
    }
    #setup-screen p {
      color: var(--muted);
      margin-bottom: 1.75rem;
    }
    .column-options {
      display: grid;
      grid-template-columns: repeat(5, 3.25rem);
      gap: 0.6rem;
      justify-content: center;
    }
    .column-options button {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      border: 2px solid var(--dot-stroke);
      background: var(--dot-fill);
      color: var(--dot-stroke);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .column-options button:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ---- Canvas screen ---- */
    #canvas-screen {
      display: none;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }
    #canvas-screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .canvas-header h1 {
      font-size: 1.25rem;
      margin: 0;
    }
    #back-btn {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #back-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    #dot-grid-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #dot-grid {
      display: block;
      height: auto;
    }
  </style>
</head>
<body>

  <!-- Screen 1: choose number of dot columns -->
  <main id="setup-screen">
    <div>
      <h1>Braidwork Creator</h1>
      <p>How many dot columns would you like?</p>
      <div class="column-options" id="column-options"></div>
    </div>
  </main>

  <!-- Screen 2: the dot grid -->
  <section id="canvas-screen">
    <div class="canvas-header">
      <h1 id="canvas-title"></h1>
      <button id="back-btn" type="button">Change columns</button>
    </div>
    <div id="dot-grid-wrap"></div>
  </section>

  <script>
    const MIN_COLUMNS = 2;
    const MAX_COLUMNS = 10;
    const DOTS_PER_COLUMN = 15;

    const setupScreen = document.getElementById('setup-screen');
    const canvasScreen = document.getElementById('canvas-screen');
    const columnOptions = document.getElementById('column-options');
    const dotGridWrap = document.getElementById('dot-grid-wrap');
    const canvasTitle = document.getElementById('canvas-title');
    const backBtn = document.getElementById('back-btn');

    // Build the preset column-count buttons (2-10)
    for (let n = MIN_COLUMNS; n <= MAX_COLUMNS; n++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = n;
      btn.addEventListener('click', () => showDotGrid(n));
      columnOptions.appendChild(btn);
    }

    backBtn.addEventListener('click', () => {
      canvasScreen.classList.remove('active');
      setupScreen.style.display = 'flex';
      dotGridWrap.innerHTML = '';
    });

    function showDotGrid(numColumns) {
      setupScreen.style.display = 'none';
      canvasScreen.classList.add('active');
      canvasTitle.textContent = `${numColumns} column${numColumns === 1 ? '' : 's'}`;
      dotGridWrap.innerHTML = '';
      dotGridWrap.appendChild(buildDotGridSvg(numColumns));
    }

    // Builds an SVG of evenly spaced dot columns. Every other column is
    // offset vertically by half the row spacing, matching the staggered
    // grid used as the starting point for Islamic geometric braid patterns.
    function buildDotGridSvg(numColumns) {
      const colSpacing = 92;
      const rowSpacing = 64;
      const radius = 9;
      const marginX = 46;
      const marginY = 46;

      const width = marginX * 2 + colSpacing * (numColumns - 1);
      const height = marginY * 2 + rowSpacing * (DOTS_PER_COLUMN - 1) + rowSpacing / 2;

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('id', 'dot-grid');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.style.maxWidth = '100%';

      for (let col = 0; col < numColumns; col++) {
        const x = marginX + col * colSpacing;
        const yOffset = col % 2 === 1 ? rowSpacing / 2 : 0;

        for (let row = 0; row < DOTS_PER_COLUMN; row++) {
          const y = marginY + yOffset + row * rowSpacing;
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', y);
          circle.setAttribute('r', radius);
          circle.setAttribute('fill', 'var(--dot-fill)');
          circle.setAttribute('stroke', 'var(--dot-stroke)');
          circle.setAttribute('stroke-width', '1.5');
          svg.appendChild(circle);
        }
      }

      return svg;
    }
  </script>
</body>
</html>
